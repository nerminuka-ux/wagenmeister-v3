<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wagenmeister Dokumente V2</title>
<style>
:root{--p:#123f3e;--bg:#eef1ed;--gold:#d9ad3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#111}.bar{position:sticky;top:0;z-index:10;background:var(--p);color:#fff;padding:calc(9px + env(safe-area-inset-top)) 12px 9px;display:flex;align-items:center;justify-content:space-between}.bar a{background:#fff;color:var(--p);padding:9px 11px;border-radius:10px;text-decoration:none;font-weight:800}.wrap{padding:14px}.card{max-width:760px;margin:16px auto;background:#fff;border-radius:16px;padding:17px;box-shadow:0 3px 18px rgba(0,0,0,.08)}h2{margin:0 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid a{padding:15px 10px;border-radius:12px;background:var(--p);color:#fff;text-align:center;text-decoration:none;font-weight:850}.grid .gold{background:var(--gold);color:#352a10}.ver{text-align:center;color:#66716e;font-size:11px;margin-top:12px}#abstell{font-family:Arial,sans-serif}.ab{width:100%;border-collapse:collapse;font-size:11px}.ab th,.ab td{border:1px solid #222;padding:7px}.ab .title{border:0;font-size:22px;text-align:left;padding:0 0 16px}.ab .center{text-align:center}.ab .small{font-size:9px}.ab .section{background:#eee;text-align:left}.ab .digit{font-size:20px;font-weight:700;text-align:center;height:42px}.ab .blank td{height:35px}.box{display:inline-flex;width:18px;height:18px;border:1px solid #111;align-items:center;justify-content:center;font-weight:900;margin-right:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}}@media print{.bar,.menu,.ver{display:none!important}.wrap{padding:0}.card{box-shadow:none;margin:0;max-width:none}}
</style>
</head>
<body>
<div class="bar"><b id="title">Dokumente</b><a href="./index.html">✕ Zur App</a></div>
<div class="wrap"><div id="host"></div></div>
<script>
const saved=(()=>{try{return JSON.parse(localStorage.getItem('wm_v3_form')||'{}')||{}}catch{return{}}})();
const train=(()=>{try{return JSON.parse(localStorage.getItem('wm_v3_train')||'[]')||[]}catch{return[]}})();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const sum=k=>train.reduce((a,w)=>a+(Number(w?.[k])||0),0);const last4=x=>String(x||'').replace(/\D/g,'').slice(-4);const dateDE=()=>{const x=saved.date||'';if(!x)return'';const [y,m,d]=x.split('-');return d+'.'+m+'.'+y};
function menu(){return `<div class="card menu"><h2>Wagenmeister-Dokumente</h2><p>Neue cache-unabhängige Dokumentseite.</p><div class="grid"><a href="?id=wagenliste">📋 Wagenliste</a><a href="?id=bremszettel">🧾 Bremszettel</a><a href="?id=wu">🛠️ WU / ZP</a><a href="?id=meldezettel">📝 Meldezettel</a><a href="?id=abstellzettel">🅿️ Abstellzettel</a><a class="gold" href="./index.html#dokumente">📊 Zur Excel-Erstellung</a></div><div class="ver">WM DOC V2 0147</div></div>`}
function box(on){return `<span class="box">${on?'X':''}</span>`}
function abstell(){const a=last4(train[0]?.number),b=last4(train.at(-1)?.number);const digs=v=>[0,1,2,3].map(i=>`<td class="digit">${esc(v[i]||'')}</td>`).join('');const rows=Array.from({length:11},()=>'<tr class="blank"><td colspan="2"></td><td colspan="2"></td><td></td><td colspan="3"></td></tr>').join('');return `<div class="card" id="abstell"><table class="ab"><tr><th colspan="8" class="title">Meldezettel Abstellung</th></tr><tr><td colspan="2">Abgestellt in</td><td colspan="4" class="center"><b>${esc(saved.docLocation||saved.from||'')}</b></td><td class="center"><b>${esc(saved.docTrack||'')}</b></td><td></td></tr><tr><td colspan="2"></td><td colspan="4" class="center small">Betriebsstelle</td><td class="center small">Gleis</td><td></td></tr><tr><td colspan="2">Abgestellt am</td><td colspan="4" class="center"><b>${esc(dateDE())}</b></td><td class="center"><b>${esc(saved.time||'')}</b></td><td></td></tr><tr><td colspan="2"></td><td colspan="4" class="center small">Datum</td><td class="center small">Uhrzeit</td><td></td></tr><tr><td colspan="2"><b>Gewicht/Achsen</b></td><td class="center"><b>${sum('total').toFixed(0)}</b></td><td class="center"><b>${sum('axles')}</b></td><td><b>Erstellt</b></td><td colspan="3" class="center"><b>${esc(saved.createdBy||'')}</b></td></tr><tr><td colspan="2"></td><td class="center small">Tonnen</td><td class="center small">Achsen</td><td></td><td colspan="3" class="center small">Name (Druckschrift)</td></tr><tr><th colspan="4">Erstes Fahrzeug <span class="small">(vier Endziffern)</span></th><th colspan="4">Letztes Fahrzeug <span class="small">(vier Endziffern)</span></th></tr><tr>${digs(a)}${digs(b)}</tr><tr><th colspan="8" class="section">Angaben zur Sicherung (zutreffendes ankreuzen)</th></tr><tr><td colspan="8" class="center">${box(!!saved.parkAir)} Sicherung nur mit Druckluftbremse</td></tr><tr><td colspan="8" class="center">${box(!!saved.parkLoco)} Sicherung nur mit Triebfahrzeug</td></tr><tr><th colspan="2">Hemmschuhe<br>Radvorleger</th><th colspan="2">Feststellbremsen</th><th>Lastwechsel</th><th colspan="3">Fahrzeugnummer (vier Endziffern)</th></tr>${rows}</table><div class="ver">WM DOC V2 0147</div></div>`}
const id=new URLSearchParams(location.search).get('id');if(!id)document.getElementById('host').innerHTML=menu();else if(id==='abstellzettel'){document.getElementById('title').textContent='Abstellzettel';document.getElementById('host').innerHTML=abstell()}else{document.getElementById('host').innerHTML='<div class="card"><b>Original-Excel wird vorbereitet …</b><div class="ver">WM DOC V2 0147</div></div>'}
</script>
<script src="./template-store.js?v=20260819-0147"></script>
<script src="./original-export.js?v=20260819-0147"></script>
<script src="./functional-fix.js?v=20260819-0147"></script>
<!-- hotfix-documents.js intentionally named here so old service workers do not inject their cached copy -->
</body>
</html>
