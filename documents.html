<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wagenmeister Dokument</title><style>body{margin:0;background:#eef1ed;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#111}.bar{position:sticky;top:0;z-index:5;background:#123f3e;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}.bar button{border:0;border-radius:10px;padding:10px 12px;font-weight:800}.close{background:#fff;color:#123f3e;font-size:18px}.wrap{padding:12px;overflow:auto}.sheet{background:#fff;margin:auto;box-shadow:0 3px 18px rgba(0,0,0,.18);padding:12mm;box-sizing:border-box}.portrait{width:190mm;min-height:260mm}.landscape{width:277mm;min-height:190mm}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:14px}.head img{width:42mm;max-height:18mm;object-fit:contain}.row{display:grid;grid-template-columns:58mm 1fr;border-bottom:1px solid #aaa;padding:6px 0;font-size:12px}table{width:100%;border-collapse:collapse;font-size:10px}th,td{border:1px solid #333;padding:4px;text-align:center}@media(max-width:700px){.sheet{transform-origin:top left}}</style></head><body><div class="bar"><b id="title">Dokument</b><button class="close" onclick="history.length>1?history.back():location.href='./index.html'">✕ Schließen</button></div><div class="wrap"><div id="host"></div></div><script>const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const saved=(()=>{try{return JSON.parse(localStorage.getItem('wm_v3_form')||'{}')}catch{return{}}})();const train=(()=>{try{return JSON.parse(localStorage.getItem('wm_v3_train')||'[]')}catch{return[]}})();const v=id=>saved[id]??document.getElementById(id)?.value??'';const sum=k=>train.reduce((a,w)=>a+(Number(w?.[k])||0),0);const dateDE=()=>{const x=saved.date||'';if(!x)return'';const[y,m,d]=x.split('-');return d+'.'+m+'.'+y};const row=(k,val)=>'<div class="row"><b>'+esc(k)+'</b><span>'+esc(val)+'</span></div>';const head=t=>'<div class="head"><div><div style="font-size:24px;font-weight:800">'+esc(t)+'</div><div style="font-size:11px">GELSEN-LOG Wagenmeister</div></div><img src="logo.jpg"></div>';function build(id){if(id==='wagenliste'){const rows=train.map((w,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(w.number||'')+'</td><td>'+(w.axles||'')+'</td><td>'+(w.length||'')+'</td><td>'+(w.load||'')+'</td><td>'+(w.total||'')+'</td><td>'+(w.brakeP||'')+'</td><td>'+(w.brakeG||'')+'</td><td>'+esc(w.destination||saved.to||'')+'</td></tr>').join('');return '<div class="sheet landscape">'+head('Wagenliste')+'<div style="font-size:12px;margin-bottom:8px">Zug '+esc(saved.trainNo||'')+' · '+esc(saved.from||'')+' → '+esc(saved.to||'')+' · '+dateDE()+'</div><table><tr><th>Pos.</th><th>Wagennummer</th><th>Achsen</th><th>Länge</th><th>Ladung</th><th>Gesamt</th><th>P</th><th>G</th><th>Ziel</th></tr>'+rows+'<tr><th colspan="2">Summe</th><th>'+sum('axles')+'</th><th>'+sum('length').toFixed(2)+'</th><th>'+sum('load').toFixed(2)+'</th><th>'+sum('total').toFixed(2)+'</th><th>'+sum('brakeP').toFixed(0)+'</th><th>'+sum('brakeG').toFixed(0)+'</th><th></th></tr></table></div>'}if(id==='bremszettel'){const total=sum('total'),bp=sum('brakeP'),bh=total?Math.floor(bp/total*100):0;return '<div class="sheet portrait">'+head('Bremszettel')+row('Zugnummer',saved.trainNo||'')+row('Datum',dateDE())+row('Gültig ab',saved.from||'')+row('Gesamtgewicht',total.toFixed(1)+' t')+row('Bremsgewicht P',bp.toFixed(1)+' t')+row('Radsätze',sum('axles'))+row('Zuglänge',sum('length').toFixed(1)+' m')+row('Bremshundertstel',bh)+row('Mindestbremshundertstel',saved.minBrakePercent||'')+row('Letztes Fahrzeug',train.at(-1)?.number||'')+row('Erstellt durch',saved.createdBy||'')+'</div>'}if(id==='wu'){return '<div class="sheet portrait">'+head('WU / ZP-Protokoll')+row('Zugnummer',saved.trainNo||'')+row('Datum',dateDE())+row('Nach',saved.to||'')+row('Uhrzeit',saved.time||'')+row('Wagenanzahl',train.length)+row('Radsätze',sum('axles'))+row('Ort',saved.docLocation||'')+row('Gleis',saved.docTrack||'')+row('Grund',saved.reason||'')+row('Besonderheiten',saved.specialNotes||'')+row('Erstellt durch',saved.createdBy||'')+'</div>'}return '<div class="sheet portrait">'+head('Meldezettel – Zugvorbereitung')+row('Zugnummer',saved.trainNo||'')+row('Datum',dateDE())+row('Betriebsstelle',saved.from||'')+row('Gleis',saved.docTrack||'')+row('Gewicht',sum('total').toFixed(1)+' t')+row('Radsätze',sum('axles'))+row('Erstes Fahrzeug',train[0]?.number||'')+row('Letztes Fahrzeug',train.at(-1)?.number||'')+row('Erstellt durch',saved.createdBy||'')+'</div>'}const id=new URLSearchParams(location.search).get('id')||'wagenliste';const names={wagenliste:'Wagenliste',bremszettel:'Bremszettel',wu:'WU / ZP-Protokoll',meldezettel:'Meldezettel'};$('title').textContent=names[id]||'Dokument';$('host').innerHTML=build(id);function fit(){const s=document.querySelector('.sheet'),w=document.querySelector('.wrap');if(!s||!w)return;s.style.transform='none';s.style.marginBottom='0';const r=s.getBoundingClientRect();const scale=Math.min(1,(w.clientWidth-24)/r.width);s.style.transform='scale('+scale+')';s.style.marginBottom=(r.height*(scale-1))+'px'}setTimeout(fit,30);addEventListener('resize',fit);</script></body></html>
