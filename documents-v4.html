<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153f3b"><title>Wagenmeister V4 Dokumente</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1e8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#182522}.bar{position:sticky;top:0;z-index:10;background:#153f3b;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center}.bar a{background:#e7efec;color:#153f3b;padding:9px 12px;border-radius:11px;text-decoration:none;font-weight:800}.wrap{padding:12px}.page{max-width:900px;margin:0 auto 14px;background:#fff;padding:14px;border:1px solid #c8c8c8;box-shadow:0 2px 8px #0001}.template{width:100%;height:auto;display:block;border:1px solid #ddd;background:#fff}.summary{margin-top:12px;border:1px solid #d7d2c7;border-radius:12px;padding:12px;background:#faf9f5}.summary h3{margin:0 0 8px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.field{background:#f1f2ee;border-radius:9px;padding:8px;font-size:12px}.field small{display:block;color:#68736f}.tbl{width:100%;border-collapse:collapse;font-size:11px;margin-top:10px}.tbl th,.tbl td{border:1px solid #999;padding:5px;text-align:center}.tbl th{background:#eee}.actions{max-width:900px;margin:0 auto 20px;display:flex;gap:8px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;background:#153f3b;color:#fff}.note{font-size:11px;color:#68736f;margin-top:8px}@media print{.bar,.actions,.note{display:none}.wrap{padding:0}.page{box-shadow:none;border:0;margin:0;max-width:none}.summary{page-break-inside:avoid}}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.page{padding:8px}}</style></head><body><div class="bar"><b id="barTitle">Dokument</b><a href="./index.html#dokumente">✕ Zur App</a></div><div class="wrap"><div id="host"></div><div class="actions"><button class="btn" onclick="window.print()">Drucken / PDF</button></div></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let train=[],form={};try{train=JSON.parse(localStorage.getItem('wm4s_train')||'[]')}catch{}try{form=JSON.parse(localStorage.getItem('wm4s_form')||'{}')}catch{}const num=v=>Number(v)||0,sum=k=>train.reduce((a,w)=>a+num(w?.[k]),0),total=()=>train.reduce((a,w)=>a+num(w?.tare)+num(w?.load),0);const dte=()=>{const x=form.date||'';if(!x)return'';const p=x.split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:x};const summary=()=>`<div class="summary"><h3>Aktuelle Zugdaten</h3><div class="grid"><div class="field"><small>Zugnummer</small>${esc(form.trainNo||'')}</div><div class="field"><small>Datum</small>${esc(dte())}</div><div class="field"><small>Von</small>${esc(form.from||'')}</div><div class="field"><small>Nach</small>${esc(form.to||'')}</div><div class="field"><small>Wagen / Radsätze</small>${train.length} / ${sum('axles')}</div><div class="field"><small>Länge / Gesamtgewicht</small>${sum('length').toFixed(2)} m / ${total().toFixed(2)} t</div><div class="field"><small>Bremsgewicht P / G</small>${sum('brakeP').toFixed(0)} / ${sum('brakeG').toFixed(0)}</div><div class="field"><small>Erstes / letztes Fahrzeug</small>${esc(train[0]?.number||'')} / ${esc(train.at(-1)?.number||'')}</div></div></div>`;function original(img,title){return `<div class="page"><img class="template" src="./${img}" alt="${esc(title)}">${summary()}<div class="note">Originalvorlage mit den aktuellen V4-Zugdaten. Als nächster Schritt werden die Werte exakt in die vorgesehenen Felder der Vorlage gesetzt.</div></div>`}function abstell(){const first=String(train[0]?.number||'').replace(/\D/g,'').slice(-4),last=String(train.at(-1)?.number||'').replace(/\D/g,'').slice(-4);return `<div class="page"><h2>Meldezettel Abstellung</h2>${summary()}<table class="tbl"><tr><th>Erstes Fahrzeug</th><th>Letztes Fahrzeug</th><th>Gewicht</th><th>Radsätze</th></tr><tr><td>${esc(first)}</td><td>${esc(last)}</td><td>${total().toFixed(0)} t</td><td>${sum('axles')}</td></tr></table></div>`}const id=new URLSearchParams(location.search).get('id')||'brems';const map={brems:['Bremszettel',()=>original('brems_template.png','Bremszettel')],wu:['WU / ZP-Protokoll',()=>original('wu_template.png','WU / ZP-Protokoll')],melde:['Meldezettel',()=>original('melde_template.png','Meldezettel')],abstell:['Abstellzettel',abstell]};const x=map[id]||map.brems;document.getElementById('barTitle').textContent=x[0];document.getElementById('host').innerHTML=x[1]();</script></body></html>
