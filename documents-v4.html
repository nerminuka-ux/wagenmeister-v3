<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153f3b"><title>Wagenmeister V4 Dokumente</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1e8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#182522}.bar{position:sticky;top:0;z-index:10;background:#153f3b;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center}.bar a{background:#e7efec;color:#153f3b;padding:9px 12px;border-radius:11px;text-decoration:none;font-weight:800}.wrap{padding:12px}.page{max-width:900px;margin:0 auto 14px;background:#fff;padding:18px;border:1px solid #c8c8c8;box-shadow:0 2px 8px #0001}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:10px}.brand{font-size:21px;font-weight:900}.brand span{color:#c22}.title{font-size:24px;font-weight:900;text-align:center}.meta{font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.field{border-bottom:1px solid #333;min-height:38px;padding:5px}.field small{display:block;color:#68736f}.tbl{width:100%;border-collapse:collapse;font-size:11px;margin-top:10px}.tbl th,.tbl td{border:1px solid #222;padding:5px;text-align:center}.tbl th{background:#eee}.box{display:inline-block;width:16px;height:16px;border:1px solid #111;vertical-align:middle;margin:0 4px}.notes{min-height:130px;border:1px solid #222;margin-top:10px;padding:8px}.actions{max-width:900px;margin:0 auto 20px;display:flex;gap:8px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;background:#153f3b;color:#fff}@media print{.bar,.actions{display:none}.wrap{padding:0}.page{box-shadow:none;border:0;margin:0;max-width:none;page-break-after:always}}@media(max-width:600px){.grid{grid-template-columns:1fr}.page{padding:11px}.title{font-size:19px}}</style></head><body><div class="bar"><b id="barTitle">Dokument</b><a href="./index.html">✕ Zur App</a></div><div class="wrap"><div id="host"></div><div class="actions"><button class="btn" onclick="window.print()">Drucken / PDF</button></div></div><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let train=[],form={};try{train=JSON.parse(localStorage.getItem('wm4s_train')||'[]')}catch{}try{form=JSON.parse(localStorage.getItem('wm4s_form')||'{}')}catch{}const sum=k=>train.reduce((a,w)=>a+(Number(w?.[k])||0),0);const total=()=>train.reduce((a,w)=>a+(Number(w?.tare)||0)+(Number(w?.load)||0),0);const dateDE=()=>{const x=form.date||'';if(!x)return'';const p=x.split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:x};const common=title=>`<div class="head"><div class="brand">GELSEN-<span>LOG.</span><div class="meta">RAIL SERVICES</div></div><div class="title">${title}</div><div class="meta">Datum: <b>${esc(dateDE())}</b><br>Zug: <b>${esc(form.trainNo||'')}</b></div></div><div class="grid"><div class="field"><small>Von</small>${esc(form.from||'')}</div><div class="field"><small>Nach</small>${esc(form.to||'')}</div><div class="field"><small>Abfahrtszeit</small>${esc(form.time||'')}</div><div class="field"><small>Erstellt durch</small>${esc(form.createdBy||'')}</div></div>`;function brems(){const p=sum('brakeP'),g=sum('brakeG');return `<div class="page">${common('Bremszettel')}<table class="tbl"><tr><th>Wagen</th><th>Radsätze</th><th>Länge m</th><th>Gesamt t</th><th>Bremsgewicht P</th><th>Bremsgewicht G</th></tr><tr><td>${train.length}</td><td>${sum('axles')}</td><td>${sum('length').toFixed(2)}</td><td>${total().toFixed(2)}</td><td>${p.toFixed(0)}</td><td>${g.toFixed(0)}</td></tr></table><p><b>Erstes Fahrzeug:</b> ${esc(train[0]?.number||'')}</p><p><b>Letztes Fahrzeug:</b> ${esc(train.at(-1)?.number||'')}</p><div class="notes">Bemerkungen / Bremsprobe:</div></div>`}function wu(){return `<div class="page">${common('WU / ZP – PROTOKOLL')}<div class="grid"><div class="field"><small>Wagenanzahl</small>${train.length}</div><div class="field"><small>Ort / Gleis</small></div><div class="field">Schlussscheiben: <span class="box"></span> ja <span class="box"></span> nein</div><div class="field">Volle Bremsprobe: <span class="box"></span> ja <span class="box"></span> nein</div><div class="field">Gefahrgut im Zug: <span class="box"></span> ja <span class="box"></span> nein</div><div class="field"><small>Erstes / letztes Fahrzeug</small>${esc(train[0]?.number||'')} / ${esc(train.at(-1)?.number||'')}</div></div><div class="notes">Besonderheiten / Schäden / weitere Bremsprüfungen:</div><p>Bremsprobe durchgeführt – Name / Unterschrift: ______________________________</p></div>`}function melde(){return `<div class="page">${common('Meldezettel')}<table class="tbl"><tr><th>Pos.</th><th>Wagennummer</th><th>Art der Meldung / Mangel</th><th>Bemerkung</th></tr>${train.map((w,i)=>`<tr><td>${i+1}</td><td>${esc(w.number)}</td><td></td><td>${esc(w.remarks||'')}</td></tr>`).join('')||'<tr><td colspan="4">Keine Wagen im Zug</td></tr>'}</table></div>`}function abstell(){const first=String(train[0]?.number||'').replace(/\D/g,'').slice(-4),last=String(train.at(-1)?.number||'').replace(/\D/g,'').slice(-4);return `<div class="page">${common('Meldezettel Abstellung')}<div class="grid"><div class="field"><small>Abgestellt in / Gleis</small>${esc(form.from||'')}</div><div class="field"><small>Gewicht / Achsen</small>${total().toFixed(0)} t / ${sum('axles')}</div><div class="field"><small>Erstes Fahrzeug (4 Endziffern)</small>${esc(first)}</div><div class="field"><small>Letztes Fahrzeug (4 Endziffern)</small>${esc(last)}</div></div><p><span class="box"></span> Sicherung nur mit Druckluftbremse</p><p><span class="box"></span> Sicherung nur mit Triebfahrzeug</p><table class="tbl"><tr><th>Hemmschuhe / Radvorleger</th><th>Feststellbremsen</th><th>Lastwechsel</th><th>Fahrzeugnummer</th></tr>${Array.from({length:8},()=>'<tr><td>&nbsp;</td><td></td><td></td><td></td></tr>').join('')}</table></div>`}const id=new URLSearchParams(location.search).get('id')||'brems';const map={brems:['Bremszettel',brems],wu:['WU / ZP-Protokoll',wu],melde:['Meldezettel',melde],abstell:['Abstellzettel',abstell]};const x=map[id]||map.brems;$('barTitle').textContent=x[0];$('host').innerHTML=x[1]();</script></body></html>
